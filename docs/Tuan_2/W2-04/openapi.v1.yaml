    StatusReceived:
      value:
        request_id: st1-20261006-000123
        state: RECEIVED
        decision: null
        reason: null
        product_id: PCB1-SN-000123
        product_type: PCB1
        station_id: station-sim
        retry_of: null
        received_at: '2026-10-06T08:15:30.120Z'
