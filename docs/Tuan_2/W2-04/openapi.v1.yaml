    StatusFailed:
      value:
        request_id: st1-20261006-000124
        state: FAILED
        decision: null
        reason: BACKEND_ERROR
        product_id: PCB1-SN-000124
        product_type: PCB1
        station_id: station-sim
        retry_of: null
        received_at: '2026-10-06T08:15:36.120Z'
