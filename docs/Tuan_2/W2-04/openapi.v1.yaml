openapi: 3.1.0
info:
  title: VIN VR 01 Business API (PCB1 inspection)
  version: 1.0.0-draft.1
  summary: Business API cho module khác gửi ảnh kiểm tra và đọc kết quả; tách khỏi API nội bộ của Triton.
  description: |
    Hợp đồng W2-04, draft-1 ngày 06/10/2026. Trạng thái: ĐÃ NỘP, CHỜ MENTOR/INTEGRATION REVIEW.

    - Hai plane tách biệt: **inference plane** (cổng 8443, `/v1/inspections`, `/v1/stations/{id}/active-recipe`)
      và **management plane** (cổng 9443, `/v1/admin/...`, chỉ admin). Hai plane không chia sẻ route.
      Path của plane này không tồn tại trên cổng của plane kia (trả 404).
    - Client không bao giờ gọi Triton. Client không gửi tên model, tên tensor hay version Triton; model được suy ra từ
      recipe active của station và được pin vào request lúc admission.
    - Phiên bản API nằm trong path (`/v1`). Thay đổi breaking phải đổi sang `/v2`. Có thể thêm trường mới vào response
      (client phải bỏ qua trường lạ); request vẫn từ chối trường lạ.
    - Lỗi trả về theo RFC 9457 (`application/problem+json`), có thêm `code`, `trace_id`, `request_id`, `retryable`.
    - Mọi response có header `X-Trace-Id`. Client có thể gửi `X-Trace-Id` của mình; nếu không, server tự tạo.
    - Các giá trị trong `x-limits` là **đề xuất**. Execution timeout chờ Operations chốt (W2-01 Q3); REVIEW band chờ
      QC chốt (W2-01 Q1).
  x-status: SUBMITTED_PENDING_REVIEW
  x-global-responses:
    description: Có thể xảy ra ở mọi path, không lặp lại trong từng operation.
    '404': {$ref: '#/components/responses/NotFound'}
    '405': {$ref: '#/components/responses/MethodNotAllowed'}
    '500': {$ref: '#/components/responses/InternalError'}
  x-source-usecase: docs/Tuan_2/W2-01/usecase-pcb1.json (draft-1)
  x-limits:
    max_body_bytes: 6291456
    max_image_bytes: 4194304
    max_image_width: 4096
    max_image_height: 4096
    allowed_image_types: [image/png, image/jpeg]
    queue_capacity: 8
    max_inflight: 1
    queue_timeout_s: 5
    execution_timeout_s: 10
    body_read_timeout_s: 10
    review_band: 0.05
    list_limit_max: 100
servers:
  - url: https://{edge_host}:8443
    description: Inference plane (camera/replay, QC UI, MES simulator)
    variables:
      edge_host:
        default: edge.local
  - url: https://{edge_host}:9443
    description: Management plane (admin lifecycle/config, audit)
    variables:
      edge_host:
        default: edge.local
tags:
  - name: inspections
    description: Inference plane - gửi ảnh, xem trạng thái, đọc kết quả.
  - name: management
    description: Management plane - package/recipe/activation/rollback/audit. Chỉ role admin.
  - name: health
    description: Liveness/readiness cho Kubernetes probe, không cần token, không trả dữ liệu nghiệp vụ.
security:
  - bearerAuth: []
x-rbac:
  roles:
    viewer: QC UI, người giám sát, MES simulator chỉ đọc kết quả.
    operator: Camera simulator / replay tool, quyền gửi ảnh và đọc kết quả.
    admin: Kỹ sư vận hành, quản lý model/recipe trên management plane; không gửi ảnh kiểm tra.
paths:
  /healthz:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness - tiến trình còn sống.
      security: []
      x-plane: both
      x-roles: [anonymous]
      responses:
        '200':
          description: Tiến trình sống.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Liveness'}
              example: {status: alive}
  /readyz:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness - có nhận request kiểm tra mới hay không.
      security: []
      x-plane: both
      x-roles: [anonymous]
      responses:
        '200':
          description: Sẵn sàng nhận request mới.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {ready: true, reasons: []}
        '503':
          description: Không sẵn sàng; submit mới sẽ nhận 503.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {ready: false, reasons: [STORAGE_UNAVAILABLE]}
  /v1/inspections:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
    post:
      tags: [inspections]
      operationId: submitInspection
      summary: Gửi một ảnh của một sản phẩm để kiểm tra (một ảnh/request, batch 1).
      description: |
        Trả `202` sau khi request đã được ghi bền và pin recipe/model. Kết quả đọc bằng GET theo `request_id`.
        `request_id` là khóa idempotency: gửi lại cùng ID + cùng payload trả `200` với record cũ, không infer lại;
        cùng ID + payload khác trả `409 IDEMPOTENCY_CONFLICT`. Kiểm tra lại sau lỗi kỹ thuật phải dùng ID mới kèm `retry_of`.
        Các lỗi 400/413/415/422 xảy ra trước admission và không tạo record.
      x-plane: inference
      x-roles: [operator]
      x-usecase-cases: [N1, F1, F2, F3, F4, F5, F6, F7, F8, F9]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InspectionSubmit'}
            examples:
              pcb1:
                $ref: '#/components/examples/SubmitPcb1'
      responses:
        '202':
          description: Đã nhận và ghi bền (state RECEIVED).
          headers:
            X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionStatus'}
              examples:
                received: {$ref: '#/components/examples/StatusReceived'}
        '200':
          description: Gửi lại cùng request_id + cùng payload; trả record hiện có, không xử lý lại.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
            Idempotent-Replay: {$ref: '#/components/headers/Idempotent-Replay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionStatus'}
              examples:
                replay: {$ref: '#/components/examples/StatusCompletedOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '409':
          description: IDEMPOTENCY_CONFLICT (cùng ID, khác payload) hoặc RECIPE_VERSION_MISMATCH.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                conflict: {$ref: '#/components/examples/ProblemIdempotencyConflict'}
                recipe: {$ref: '#/components/examples/ProblemRecipeVersionMismatch'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: IMAGE_UNDECODABLE, IMAGE_TOO_LARGE_DIMENSIONS hoặc RECIPE_NOT_FOUND (product_type không có recipe).
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                image: {$ref: '#/components/examples/ProblemImageUndecodable'}
        '429': {$ref: '#/components/responses/QueueFull'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [inspections]
      operationId: listInspections
      summary: Tra lịch sử kiểm tra theo product_id (QC UI, MES simulator).
      x-plane: inference
      x-roles: [viewer, operator, admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: product_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/ProductId'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          required: false
          description: Giá trị `next_cursor` từ trang trước.
          schema: {type: string, pattern: '^[0-9]{1,18}$'}
      responses:
        '200':
          description: Danh sách mới nhất trước.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/inspections/{request_id}:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [inspections]
      operationId: getInspectionStatus
      summary: Trạng thái xử lý của một request.
      x-plane: inference
      x-roles: [viewer, operator, admin]
      x-usecase-cases: [F12, F14, F15]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Trạng thái hiện tại.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionStatus'}
              examples:
                completed: {$ref: '#/components/examples/StatusCompletedOk'}
                failed: {$ref: '#/components/examples/StatusFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/inspections/{request_id}/result:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [inspections]
      operationId: getInspectionResult
      summary: Kết quả terminal kèm lineage đầy đủ.
      description: |
        `200` chỉ khi state terminal. `decision` chỉ khác null khi `state=COMPLETED`;
        FAILED/TIMEOUT/INDETERMINATE luôn có `decision=null` và `reason`. Chưa terminal trả `409 RESULT_NOT_READY`.
      x-plane: inference
      x-roles: [viewer, operator, admin]
      x-usecase-cases: [N1, F10, F11, F12, F14, F16]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Kết quả terminal.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionResult'}
              examples:
                ok: {$ref: '#/components/examples/ResultCompletedOk'}
                timeout: {$ref: '#/components/examples/ResultTimeout'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: RESULT_NOT_READY - request chưa terminal; đọc lại sau `Retry-After`.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/stations/{station_id}/active-recipe:
    servers:
      - url: https://{edge_host}:8443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [inspections]
      operationId: getActiveRecipe
      summary: Recipe đang active của station (để camera/replay gửi đúng recipe_version).
      x-plane: inference
      x-roles: [viewer, operator, admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/StationIdPath'
      responses:
        '200':
          description: Recipe active. Không trả tên tensor/endpoint Triton.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActiveRecipe'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/packages:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [management]
      operationId: listPackages
      summary: ModelPackage đã có trong kho đã duyệt.
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Danh sách package.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PackageSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/admin/packages/validate:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    post:
      tags: [management]
      operationId: validatePackage
      summary: Chạy validator W2-05 (schema, checksum, I/O, golden) cho một package trong kho.
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageRef'}
            example: {package_name: model-b, package_version: 0.1.0}
      responses:
        '200':
          description: Package hợp lệ.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: PACKAGE_REJECTED - kèm mã lỗi validator (E_CHECKSUM, E_IO, E_GOLDEN...).
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/admin/recipes:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [management]
      operationId: listRecipes
      summary: Recipe đã đăng ký và recipe nào đang active.
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Danh sách recipe.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RecipeSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/admin/stations/{station_id}:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [management]
      operationId: getStation
      summary: Recipe active và lịch sử activation của station.
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/StationIdPath'
      responses:
        '200':
          description: Thông tin station.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StationDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/stations/{station_id}/activation:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    post:
      tags: [management]
      operationId: activateRecipe
      summary: Kích hoạt recipe (và model của nó) cho station sau warm-up + golden check.
      description: |
        Chỉ request **mới** dùng recipe mới; request đã admission giữ recipe/model đã pin (F16).
        Golden check lỗi thì giữ nguyên recipe cũ. Activation được ghi bền và khôi phục sau restart (F13).
        `If-Match` (tùy chọn) mang `active_revision` hiện tại để tránh hai admin ghi đè nhau (412 nếu lệch).
        Kích hoạt lại đúng recipe đang active trả `200` với `changed=false`.
      x-plane: management
      x-roles: [admin]
      x-usecase-cases: [F13, F16]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/StationIdPath'
        - name: If-Match
          in: header
          required: false
          schema: {$ref: '#/components/schemas/Sha256'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivationRequest'}
            example: {recipe_name: recipe-b, recipe_version: 0.1.0, reason: chuyển sang model B cho lô thử}
      responses:
        '200':
          description: Activation đã ghi bền (hoặc no-op nếu đã active).
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: TRANSITION_BUSY - đang có activation/rollback khác.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: PRECONDITION_FAILED - If-Match khác active_revision hiện tại.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: RECIPE_NOT_FOUND, PACKAGE_REJECTED hoặc ACTIVATION_GOLDEN_FAILED; recipe cũ vẫn active.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/stations/{station_id}/rollback:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    post:
      tags: [management]
      operationId: rollbackRecipe
      summary: Quay về recipe active trước đó (cùng kiểm tra như activation).
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/StationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
            example: {reason: model B cho kết quả bất thường}
      responses:
        '200':
          description: Rollback đã ghi bền.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: TRANSITION_BUSY hoặc NO_ROLLBACK_TARGET.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: Recipe đích không còn hợp lệ (PACKAGE_REJECTED / ACTIVATION_GOLDEN_FAILED).
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/audit:
    servers:
      - url: https://{edge_host}:9443
        variables: {edge_host: {default: edge.local}}
    get:
      tags: [management]
      operationId: listAudit
      summary: Nhật ký audit (activation, rollback, validate, từ chối xác thực/phân quyền, khởi động).
      x-plane: management
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Mới nhất trước. Không bao giờ chứa token.
          headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Lab/MVP: token riêng cho từng principal (thiết bị hoặc người), server chỉ lưu SHA-256 của token.
        Luôn chạy trên TLS. Production: thay bằng mTLS + chứng chỉ do PKI nhà máy cấp (chờ Security/PKI, câu 6).
    mutualTLS:
      type: mutualTLS
      description: Đích production (chưa triển khai trong reference server). Role lấy từ chứng chỉ thiết bị.
  headers:
    X-Trace-Id:
      description: ID truy vết của lượt gọi; ghi trong log, ledger và gửi tiếp tới backend.
      schema: {$ref: '#/components/schemas/TraceId'}
    Location:
      description: URL trạng thái của request.
      schema: {type: string}
    Idempotent-Replay:
      description: '`true` khi response là record cũ của cùng request_id.'
      schema: {type: string, enum: ['true']}
    Retry-After:
      description: Số giây nên chờ trước khi thử lại.
      schema: {type: integer, minimum: 1}
  parameters:
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      schema: {$ref: '#/components/schemas/TraceId'}
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RequestId'}
    StationIdPath:
      name: station_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/StationId'}
  responses:
    BadRequest:
      description: INVALID_REQUEST - JSON/schema/base64/query sai. Không tạo record.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:vr01:problem:INVALID_REQUEST
            title: Invalid request
            status: 400
            code: INVALID_REQUEST
            detail: "$.product_id: 'PCB 1/x' does not match pattern"
            trace_id: 7f1c2a9e4b0d4c1e
            request_id: null
            retryable: false
    Unauthenticated:
      description: UNAUTHENTICATED - thiếu hoặc sai token.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: FORBIDDEN - role không được phép gọi thao tác này.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:vr01:problem:FORBIDDEN
            title: Forbidden
            status: 403
            code: FORBIDDEN
            detail: role viewer is not allowed to call submitInspection
            trace_id: 7f1c2a9e4b0d4c1e
            request_id: null
            retryable: false
    NotFound:
      description: NOT_FOUND - không có request/station/package/recipe này.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MethodNotAllowed:
      description: METHOD_NOT_ALLOWED - path đúng nhưng method sai.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: INTERNAL_ERROR - lỗi không lường trước; chi tiết chỉ nằm trong log theo trace_id.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RequestTimeout:
      description: REQUEST_TIMEOUT - client gửi body quá chậm (quá body_read_timeout_s).
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE - body > max_body_bytes hoặc ảnh > max_image_bytes. Không tạo record.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE - Content-Type không phải application/json.
      headers: {X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    QueueFull:
      description: QUEUE_FULL - hàng đợi đầy; thử lại với **cùng** request_id sau Retry-After. Không tạo record.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: NOT_READY hoặc STORAGE_UNAVAILABLE - dừng nhận request mới. Không tạo record.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:vr01:problem:NOT_READY
            title: Service not ready
            status: 503
            code: NOT_READY
            detail: BACKEND_UNAVAILABLE
            trace_id: 7f1c2a9e4b0d4c1e
            request_id: null
            retryable: true
  schemas:
    TraceId:
      type: string
      pattern: '^[A-Za-z0-9-]{8,64}$'
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
    ProductId:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
    StationId:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    SemVer:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    RecipeName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
    RecipeVersionRef:
      description: '`<recipe-name>@<semver>`, ví dụ `recipe-a@0.1.0`.'
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}@[0-9]+\.[0-9]+\.[0-9]+$'
    State:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, FAILED, TIMEOUT, INDETERMINATE]
    Decision:
      description: Chỉ khác null khi state=COMPLETED. Lỗi kỹ thuật không bao giờ thành OK/NG.
      type: [string, 'null']
      enum: [OK, NG, REVIEW, null]
    TechnicalReason:
      type: [string, 'null']
      enum: [BACKEND_ERROR, EXECUTION_TIMEOUT, QUEUE_TIMEOUT, RESTARTED_DURING_PROCESSING, null]
    Timestamp:
      type: string
      format: date-time
    InspectionSubmit:
      type: object
      additionalProperties: false
      required: [request_id, product_id, product_type, recipe_version, captured_at, station_id, image]
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        product_id: {$ref: '#/components/schemas/ProductId'}
        product_type:
          type: string
          pattern: '^[A-Z0-9_-]{1,32}$'
        recipe_version: {$ref: '#/components/schemas/RecipeVersionRef'}
        captured_at: {$ref: '#/components/schemas/Timestamp'}
        station_id: {$ref: '#/components/schemas/StationId'}
        retry_of:
          description: request_id của lần thử trước bị FAILED/TIMEOUT/INDETERMINATE (cùng product_id).
          oneOf:
            - {$ref: '#/components/schemas/RequestId'}
            - {type: 'null'}
        image:
          type: object
          additionalProperties: false
          required: [content_type, data_base64]
          properties:
            content_type:
              type: string
              enum: [image/png, image/jpeg]
            data_base64:
              type: string
              minLength: 4
              description: Base64 chuẩn. Ảnh sau giải mã tối đa `max_image_bytes`; vượt trả 413 (không phải 400).
              pattern: '^[A-Za-z0-9+/]+={0,2}$'
    Links:
      type: object
      additionalProperties: false
      required: [self, result]
      properties:
        self: {type: string}
        result: {type: string}
    InspectionStatus:
      type: object
      additionalProperties: false
      required: [request_id, state, decision, reason, product_id, product_type, station_id, retry_of, received_at, updated_at, links]
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        state: {$ref: '#/components/schemas/State'}
        decision: {$ref: '#/components/schemas/Decision'}
        reason: {$ref: '#/components/schemas/TechnicalReason'}
        product_id: {$ref: '#/components/schemas/ProductId'}
        product_type: {type: string}
        station_id: {$ref: '#/components/schemas/StationId'}
        retry_of:
          oneOf:
            - {$ref: '#/components/schemas/RequestId'}
            - {type: 'null'}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        links: {$ref: '#/components/schemas/Links'}
    RecipeRef:
      type: object
      additionalProperties: false
      required: [name, version, sha256]
      properties:
        name: {$ref: '#/components/schemas/RecipeName'}
        version: {$ref: '#/components/schemas/SemVer'}
        sha256: {$ref: '#/components/schemas/Sha256'}
    ModelRef:
      description: Định danh model theo ModelPackage W2-05 - không phải tên model/tensor nội bộ của Triton.
      type: object
      additionalProperties: false
      required: [name, version, manifest_sha256]
      properties:
        name: {type: string}
        version: {$ref: '#/components/schemas/SemVer'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
    Lineage:
      type: object
      additionalProperties: false
      required: [product_id, product_type, station_id, recipe, model, input_sha256, trace_id, submitted_by]
      properties:
        product_id: {$ref: '#/components/schemas/ProductId'}
        product_type: {type: string}
        station_id: {$ref: '#/components/schemas/StationId'}
        recipe: {$ref: '#/components/schemas/RecipeRef'}
        model: {$ref: '#/components/schemas/ModelRef'}
        input_sha256: {$ref: '#/components/schemas/Sha256'}
        trace_id: {$ref: '#/components/schemas/TraceId'}
        submitted_by: {type: string}
    InspectionResult:
      type: object
      additionalProperties: false
      required: [request_id, state, decision, score, threshold, review_band, reason, lineage, timing_ms, received_at, started_at, finished_at]
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        state:
          type: string
          enum: [COMPLETED, FAILED, TIMEOUT, INDETERMINATE]
        decision: {$ref: '#/components/schemas/Decision'}
        score: {type: [number, 'null'], minimum: 0, maximum: 1}
        threshold: {type: number, minimum: 0, maximum: 1}
        review_band: {type: number, minimum: 0, maximum: 0.5}
        reason: {$ref: '#/components/schemas/TechnicalReason'}
        lineage: {$ref: '#/components/schemas/Lineage'}
        timing_ms:
          type: object
          additionalProperties: false
          required: [queue, inference, total]
          properties:
            queue: {type: [number, 'null'], minimum: 0}
            inference: {type: [number, 'null'], minimum: 0}
            total: {type: [number, 'null'], minimum: 0}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        started_at:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
      allOf:
        - if:
            properties: {state: {const: COMPLETED}}
          then:
            properties:
              decision: {type: string}
              reason: {type: 'null'}
              score: {type: number}
          else:
            properties:
              decision: {type: 'null'}
              reason: {type: string}
    InspectionList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/InspectionStatus'}
        next_cursor: {type: [string, 'null']}
    ActiveRecipe:
      type: object
      additionalProperties: false
      required: [station_id, recipe_version, recipe, model, product_types, active_revision, activated_at]
      properties:
        station_id: {$ref: '#/components/schemas/StationId'}
        recipe_version: {$ref: '#/components/schemas/RecipeVersionRef'}
        recipe: {$ref: '#/components/schemas/RecipeRef'}
        model: {$ref: '#/components/schemas/ModelRef'}
        product_types:
          type: array
          items: {type: string}
        active_revision: {$ref: '#/components/schemas/Sha256'}
        activated_at: {$ref: '#/components/schemas/Timestamp'}
    PackageRef:
      type: object
      additionalProperties: false
      required: [package_name, package_version]
      properties:
        package_name: {$ref: '#/components/schemas/RecipeName'}
        package_version: {$ref: '#/components/schemas/SemVer'}
    PackageSummary:
      type: object
      additionalProperties: false
      required: [name, version, manifest_sha256, backend, device, purpose]
      properties:
        name: {type: string}
        version: {$ref: '#/components/schemas/SemVer'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
        backend: {type: string}
        device: {type: string}
        purpose: {type: string}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [package, outcome, golden_score]
      properties:
        package: {$ref: '#/components/schemas/ModelRef'}
        outcome: {type: string, enum: [PASS]}
        golden_score: {type: number}
    RecipeSummary:
      type: object
      additionalProperties: false
      required: [recipe, model, threshold, active, rollback_recipe]
      properties:
        recipe: {$ref: '#/components/schemas/RecipeRef'}
        model: {$ref: '#/components/schemas/ModelRef'}
        threshold: {type: number}
        active: {type: boolean}
        rollback_recipe:
          type: [string, 'null']
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [recipe_name, recipe_version, reason]
      properties:
        recipe_name: {$ref: '#/components/schemas/RecipeName'}
        recipe_version: {$ref: '#/components/schemas/SemVer'}
        reason: {type: string, minLength: 3, maxLength: 500}
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
    Activation:
      type: object
      additionalProperties: false
      required: [activation_id, station_id, changed, from_recipe, to_recipe, active_revision, golden, actor, reason, at, trace_id]
      properties:
        activation_id: {type: integer}
        station_id: {$ref: '#/components/schemas/StationId'}
        changed: {type: boolean}
        from_recipe:
          oneOf:
            - {$ref: '#/components/schemas/RecipeRef'}
            - {type: 'null'}
        to_recipe: {$ref: '#/components/schemas/RecipeRef'}
        active_revision: {$ref: '#/components/schemas/Sha256'}
        golden:
          type: object
          additionalProperties: false
          required: [expected, actual, passed]
          properties:
            expected: {type: number}
            actual: {type: [number, 'null']}
            passed: {type: boolean}
        actor: {type: string}
        reason: {type: string}
        at: {$ref: '#/components/schemas/Timestamp'}
        trace_id: {$ref: '#/components/schemas/TraceId'}
    StationDetail:
      type: object
      additionalProperties: false
      required: [station_id, active, history]
      properties:
        station_id: {$ref: '#/components/schemas/StationId'}
        active: {$ref: '#/components/schemas/ActiveRecipe'}
        history:
          type: array
          items: {$ref: '#/components/schemas/Activation'}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [seq, at, actor, role, action, target, outcome, trace_id, details]
      properties:
        seq: {type: integer}
        at: {$ref: '#/components/schemas/Timestamp'}
        actor: {type: string}
        role: {type: string}
        action: {type: string}
        target: {type: string}
        outcome: {type: string}
        trace_id: {type: string}
        details: {type: object}
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {const: alive}
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, reasons]
      properties:
        ready: {type: boolean}
        reasons:
          type: array
          items:
            type: string
            enum: [BACKEND_UNAVAILABLE, STORAGE_UNAVAILABLE, ACTIVE_RECIPE_UNVERIFIED, WARMUP_FAILED, SHUTTING_DOWN]
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - REQUEST_TIMEOUT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IMAGE_UNDECODABLE
        - IMAGE_TOO_LARGE_DIMENSIONS
        - RECIPE_NOT_FOUND
        - RECIPE_VERSION_MISMATCH
        - IDEMPOTENCY_CONFLICT
        - RESULT_NOT_READY
        - QUEUE_FULL
        - NOT_READY
        - STORAGE_UNAVAILABLE
        - TRANSITION_BUSY
        - NO_ROLLBACK_TARGET
        - PRECONDITION_FAILED
        - PACKAGE_REJECTED
        - ACTIVATION_GOLDEN_FAILED
        - INTERNAL_ERROR
    Problem:
      description: RFC 9457 problem details + trường mở rộng của VR01.
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, trace_id, request_id, retryable]
      properties:
        type: {type: string, pattern: '^urn:vr01:problem:[A-Z_]+$'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {$ref: '#/components/schemas/ErrorCode'}
        detail: {type: string}
        trace_id: {$ref: '#/components/schemas/TraceId'}
        request_id: {type: [string, 'null']}
        retryable: {type: boolean}
        details: {type: object}
  examples:
    SubmitPcb1:
      summary: Một ảnh PCB1 (ví dụ ảnh xám 4x4).
      value:
        request_id: st1-20261006-000123
        product_id: PCB1-SN-000123
        product_type: PCB1
        recipe_version: recipe-a@0.1.0
        captured_at: '2026-10-06T08:15:30Z'
        station_id: station-sim
