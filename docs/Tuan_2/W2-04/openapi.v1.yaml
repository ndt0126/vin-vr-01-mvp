        links:
          self: /v1/inspections/st1-20261006-000123
          result: /v1/inspections/st1-20261006-000123/result
    StatusCompletedOk:
      value:
        request_id: st1-20261006-000123
        state: COMPLETED
        decision: OK
        reason: null
        product_id: PCB1-SN-000123
        product_type: PCB1
        station_id: station-sim
        retry_of: null
        received_at: '2026-10-06T08:15:30.120Z'
        updated_at: '2026-10-06T08:15:30.180Z'
