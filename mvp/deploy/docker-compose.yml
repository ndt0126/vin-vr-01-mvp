# VR-01 MVP (lab): Triton + Inspection API. Chay qua Makefile o thu muc mvp/ (make build | start | stop).
# Triton KHONG publish cong ra host: chi container api goi duoc qua mang noi bo cua Compose.
name: vr01-mvp
services:
  init:
    image: vr01-mvp-api:${MVP_VERSION:-0.5.0-rc2}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    profiles: ["tools"]
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes:
      - ../run:/run-data
    environment:
      HOME: /tmp
      VR01_SLOW_ROUNDS: ${VR01_SLOW_ROUNDS:-}
    command: ["sh", "-c", "python tools/init_lab.py --run-dir /run-data --instance-kind ${TRITON_INSTANCE_KIND:-KIND_CPU} ${INIT_EXTRA:-}"]

  triton:
    image: ${TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:25.08-py3}
    command: ["tritonserver", "--model-repository=/models", "--model-control-mode=explicit",
              "--http-port=8000", "--allow-grpc=false", "--allow-metrics=true", "--metrics-port=8002"]
    volumes:
      - ../run/triton-repo:/models:ro
    expose: ["8000", "8002"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v2/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  api:
    image: vr01-mvp-api:${MVP_VERSION:-0.5.0-rc2}
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    depends_on:
      triton:
        condition: service_healthy
    command: ["python", "backend/inspection_api.py", "--host", "0.0.0.0",
              "--data-dir", "/run-data/data", "--principals", "/run-data/auth/principals.json",
              "--tls-cert", "/run-data/tls/server.crt", "--tls-key", "/run-data/tls/server.key",
              "--examples", "/run-data/examples", "--kserve-url", "http://triton:8000",
              "--metrics-port", "9090", "--ui-management-port", "${MANAGEMENT_PORT:-9443}"]
    environment:
      VR01_LIMIT_OVERRIDES: ${VR01_LIMIT_OVERRIDES:-}
    volumes:
      - ../run:/run-data
    expose: ["9090"]   # /metrics: chi trong mang Compose, khong publish ra host
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${INFERENCE_PORT:-8443}:8443"
      - "${BIND_ADDR:-127.0.0.1}:${MANAGEMENT_PORT:-9443}:9443"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://localhost:8443/readyz', context=ssl.create_default_context(cafile='/run-data/tls/ca.crt'), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---- Observability (W4-01/W4-02): make obs-start. Chi mo tren loopback; Grafana chi doc (anonymous Viewer).
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    profiles: ["obs"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
              "--storage.tsdb.retention.size=2GB", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9091}:9090"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vr01-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
