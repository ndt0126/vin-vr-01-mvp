# Cong nghiep vu mo ra ngoai node bang NodePort (lab). Khong co Service nao tro toi cong 8000 cua Triton.
apiVersion: v1
kind: Service
metadata: {name: vr01-inference, namespace: vr01}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: vr01-inspection}
  ports:
    - {name: inference, port: 8443, targetPort: inference, nodePort: 30443}
---
apiVersion: v1
kind: Service
metadata: {name: vr01-management, namespace: vr01}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: vr01-inspection}
  ports:
    - {name: management, port: 9443, targetPort: management, nodePort: 30943}
---
apiVersion: v1
kind: Service
metadata:
  name: vr01-metrics
  namespace: vr01
  labels: {vr01.io/scrape: "true"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: vr01-inspection}
  ports:
    - {name: metrics, port: 9090, targetPort: metrics}
    - {name: triton-metrics, port: 8002, targetPort: triton-metrics}
