# Gia tri moi truong: LAB, 1 GPU NVIDIA (can NVIDIA device plugin). CHUA CHAY THU.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vr01-mvp-api
    newName: vr01-mvp-api
    newTag: "0.5.0-rc1"
  - name: tritonserver
    newName: nvcr.io/nvidia/tritonserver
    digest: sha256:f836551575df7c9fb71144073845c6b3911de57db91a8c95e0687a4d2ac9f7a5
patches:
  - target: {kind: Deployment, name: vr01-inspection}
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/value
        value: KIND_GPU
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 16Gi
