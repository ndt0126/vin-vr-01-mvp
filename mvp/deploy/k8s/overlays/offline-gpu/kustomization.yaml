# Cai tu GOI OFFLINE tren node co 1 GPU NVIDIA (device plugin da co san tren node). CHUA CHAY THU (viet 11/10/2026).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vr01-mvp-api
    newName: vr01-mvp-api
    newTag: "0.5.0-rc1"
  - name: tritonserver
    newName: vr01-local/tritonserver
    newTag: "2.60.0-25.08"
patches:
  - target: {kind: Deployment, name: vr01-inspection}
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/value
        value: KIND_GPU
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 16Gi
