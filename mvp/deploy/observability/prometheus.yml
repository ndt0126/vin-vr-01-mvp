# Prometheus cho VR-01 MVP (lab). Chi scrape trong mang noi bo cua Compose.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: vr01-api
    static_configs:
      - targets: ['api:9090']
  - job_name: triton
    static_configs:
      - targets: ['triton:8002']
